[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caelestia"
version = "1.1.3"
description = "Caelestia CLI & Theming Engine for Hyprland"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
caelestia = "caelestia:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caelestia = [
    "data/emojis.txt",
    "data/schemes/*.json",
    "data/templates/*",
]
